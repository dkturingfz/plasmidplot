# Runs R CMD check on the three platforms CRAN builds for, so a change that
# only breaks elsewhere is caught here rather than after submission.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Windows on R-devel is the combination win-builder exists to
          # cover, and is what CRAN checks a new submission against.
          - {os: windows-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # A non-ASCII character in an Rd file is an ERROR on CRAN, because the
      # PDF manual goes through LaTeX. Catching it needs a two-second scan,
      # not a LaTeX toolchain on six runners -- installing TinyTeX here only
      # produced its own font failures while the real manual built fine.
      - name: Sources must be ASCII
        shell: Rscript {0}
        run: |
          offenders <- character()
          for (d in c("R", "man", "vignettes")) {
            fs <- list.files(d, pattern = "[.](R|Rd|Rmd)$", full.names = TRUE)
            for (f in fs) {
              ln <- readLines(f, warn = FALSE)
              hit <- grepl("[^\x01-\x7f]", ln, useBytes = TRUE)
              if (any(hit)) {
                offenders <- c(offenders, sprintf("%s:%d", f, which(hit)))
              }
            }
          }
          if (length(offenders)) {
            stop("Non-ASCII characters (LaTeX will reject these when CRAN ",
                 "builds the PDF manual):\n  ",
                 paste(offenders, collapse = "\n  "), call. = FALSE)
          }
          cat("R/, man/ and vignettes/ are ASCII only\n")

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # CRAN's own bar. The PDF manual is left to win-builder and to
          # CRAN's own incoming checks, which have a complete LaTeX.
          args: 'c("--no-manual", "--as-cran")'
          upload-snapshots: true
          build_args: 'c("--no-manual")'
